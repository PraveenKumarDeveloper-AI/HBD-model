      <stop offset="0%" stop-color="#2b1b17"/>
      <stop offset="50%" stop-color="#4a2c2a"/>
      <stop offset="100%" stop-color="#703d38"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#cafeGrad4)"/>

  <!-- Warm Wooden Table -->
  <ellipse cx="300" cy="460" rx="270" ry="120" fill="#38221f" stroke="#54332e" stroke-width="6"/>

