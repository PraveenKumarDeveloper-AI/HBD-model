<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="beachGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140152"/>
      <stop offset="40%" stop-color="#22007c"/>
      <stop offset="70%" stop-color="#49117c"/>
      <stop offset="100%" stop-color="#8c1c73"/>
    </linearGradient>
    <linearGradient id="seaGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#100b2e"/>
      <stop offset="100%" stop-color="#2a1442"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#beachGrad5)"/>
  
  <!-- Glowing Full Moon -->
  <circle cx="300" cy="180" r="55" fill="#fff" opacity="0.95"/>
  <circle cx="300" cy="180" r="90" fill="#fff" opacity="0.15"/>

  <!-- Ocean Water -->
  <rect y="380" width="600" height="220" fill="url(#seaGrad5)"/>

  <!-- Moonlight reflection on water -->
  <polygon points="270,380 330,380 380,600 220,600" fill="#fff" opacity="0.12"/>
  <line x1="280" y1="410" x2="320" y2="410" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="260" y1="440" x2="340" y2="440" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="240" y1="470" x2="360" y2="470" stroke="#fff" stroke-width="3" opacity="0.4"/>
  <line x1="220" y1="510" x2="380" y2="510" stroke="#fff" stroke-width="4" opacity="0.4"/>

  <!-- Shoreline / Wet Sand -->
  <path d="M 0 520 Q 300 480 600 520 L 600 600 L 0 600 Z" fill="#0d071a"/>

  <!-- Couple Silhouette Walking Hand in Hand along the shore -->
  <!-- Person 1 (Taller) -->
  <circle cx="280" cy="440" r="14" fill="#06030c"/>
  <path d="M 268 456 L 292 456 L 290 535 L 270 535 Z" fill="#06030c"/>
  <!-- Person 2 -->
  <circle cx="316" cy="446" r="13" fill="#06030c"/>
  <path d="M 305 460 L 327 460 L 325 535 L 308 535 Z" fill="#06030c"/>
  <!-- Holding hands in middle -->
  <path d="M 288 475 Q 298 488 308 478" fill="none" stroke="#06030c" stroke-width="5" stroke-linecap="round"/>

  <!-- Sparkles in waves (bioluminescent glow) -->
  <circle cx="160" cy="495" r="2.5" fill="#05d9e8" opacity="0.8"/>
  <circle cx="210" cy="505" r="3" fill="#05d9e8" opacity="0.9"/>
  <circle cx="390" cy="498" r="3" fill="#05d9e8" opacity="0.8"/>
  <circle cx="450" cy="510" r="2" fill="#05d9e8" opacity="0.7"/>

  <!-- Heart floating above -->
  <path d="M 300 375 C 300 360 280 350 270 365 C 255 385 300 410 300 420 C 300 410 345 385 330 365 C 320 350 300 360 300 375 Z" fill="#ff2a6d"/>

  <text x="300" y="580" font-family="'Outfit', sans-serif" font-size="20" fill="#f1faee" font-weight="600" text-anchor="middle" letter-spacing="3">HAND IN HAND BY THE OCEAN</text>
</svg>
