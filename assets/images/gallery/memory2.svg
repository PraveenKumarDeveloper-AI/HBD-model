<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a0ca3"/>
      <stop offset="35%" stop-color="#7209b7"/>
      <stop offset="65%" stop-color="#f72585"/>
      <stop offset="85%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <radialGradient id="sunGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#sunsetGrad2)"/>
  
  <!-- Glowing Golden Sun setting behind hills -->
  <circle cx="300" cy="360" r="85" fill="url(#sunGrad2)"/>

  <!-- Distant Mountains -->
  <polygon points="0,420 160,310 320,440" fill="#4a0e4e" opacity="0.6"/>
  <polygon points="200,440 380,290 540,430" fill="#3b0944" opacity="0.7"/>
  <polygon points="340,450 490,340 600,430" fill="#2d0536" opacity="0.6"/>

  <!-- Foreground Mountains -->
  <polygon points="-40,500 120,380 340,510" fill="#1b0326"/>
  <polygon points="260,510 460,390 640,520" fill="#15021e"/>

  <!-- Road winding through -->
  <path d="M 290 440 L 310 440 L 460 600 L 140 600 Z" fill="#201026"/>
  <!-- Road dash lines -->
  <line x1="300" y1="450" x2="300" y2="470" stroke="#ffd166" stroke-width="2"/>
  <line x1="300" y1="490" x2="300" y2="520" stroke="#ffd166" stroke-width="4"/>
  <line x1="300" y1="545" x2="300" y2="595" stroke="#ffd166" stroke-width="6"/>

  <!-- Convertible car silhouette with couple -->
  <g transform="translate(250, 475) scale(0.65)">
    <!-- Car body -->
    <path d="M 10 50 Q 30 35 60 35 L 90 35 Q 110 20 135 20 L 175 20 Q 195 35 220 35 L 240 50 Q 250 55 245 70 L 10 70 Z" fill="#fff" opacity="0.9"/>
    <!-- Wheels -->
    <circle cx="50" cy="70" r="18" fill="#15021e"/>
    <circle cx="50" cy="70" r="8" fill="#ffd166"/>
    <circle cx="205" cy="70" r="18" fill="#15021e"/>
    <circle cx="205" cy="70" r="8" fill="#ffd166"/>
    <!-- Heads -->
    <circle cx="110" cy="12" r="10" fill="#fff"/>
    <circle cx="140" cy="14" r="9" fill="#ff70a6"/>
    <!-- Heart above car -->
    <path d="M 125 -10 C 125 -20 110 -25 105 -15 C 95 0 125 15 125 22 C 125 15 155 0 145 -15 C 140 -25 125 -20 125 -10 Z" fill="#ff2a6d"/>
  </g>

  <!-- Text -->
  <text x="300" y="585" font-family="'Outfit', sans-serif" font-size="20" fill="#ffe5d9" font-weight="600" text-anchor="middle" letter-spacing="3">OUR SWEETEST ADVENTURES</text>
</svg>
